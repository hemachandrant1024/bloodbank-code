<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-image: url("https://d1csarkz8obe9u.cloudfront.net/posterpreviews/powerpoint-blood-donation-background-design-template-7dd646824b8b26a153d62c3179b31e4c_screen.jpg?ts=1710201701");
            background-repeat: no-repeat;
            max-width: 70%;
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .main h2 {
            color: #0d0d0d;
            border-color: rgb(161, 46, 199);
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #090909;
            border-color: brown;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="gender"],
        input[type="contact"],
        input[type="submit"],
        select {
            width: 90%; /* Adjusted width */
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #202104;
            border-radius: 5px;
        }
        button[type="submit"] {
            text-align: center;
            padding: 15px;
            border-radius: 1500px;
            border: none;
            background-color: #1d9e35;
            color: rgb(6, 6, 8);
            cursor: pointer;
            width: 50%; /* Adjusted width */
            font-size: 16px;
        }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML BECOME A MEMBER</title>
    <script>
        function redirectToDonation(event) {
            event.preventDefault(); // Prevent the default form submission
            window.location.href = "donation.html"; // Redirect to donation.html
        }
    </script>
</head>
<body>
    <center>
        <div class="main">
            <h2>BECOME A MEMBER</h2>
            <form action="/submit" method="POST" onsubmit="redirectToDonation(event)"> <!-- Form action to Flask route -->
                <label for="first">First Name:</label>
                <input type="text" id="first" name="first" class="input-field" placeholder="Enter your first name here" required />

                <label for="last">Last Name:</label>
                <input type="text" id="last" name="last" class="input-field" placeholder="Enter your last name here" required />

                <label for="email">Email id:</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="Enter your email id" required />

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       pattern="^(?=.\d)(?=.[a-zA-Z])(?=.*[^a-zA-Z0-9]).{8,}$" 
                       title="Password must contain at least one number, one alphabet, one symbol, and be at least 8 characters long" class="input-field" placeholder="Enter your password" required />

                <label for="repassword">Repassword:</label>
                <input type="password" id="repassword" name="repassword" class="input-field" placeholder="Enter your password again" required />

                <label for="mobile">Contact:</label>
                <input type="text" id="mobile" name="mobile" maxlength="10" class="input-field" placeholder="Enter your contact number" required />

                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <br><br><br>
                <center>
                    <button type="submit">Submit</button>
                </center>
            </form>
        </div>
    </center>
</body>
</html>
